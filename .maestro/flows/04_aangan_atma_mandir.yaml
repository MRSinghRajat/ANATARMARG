appId: com.antarmarg.app
---
# Aatma ↔ Mandir toggle. Mandir may be Pro-gated; either the 3D scene
# or the lock copy is a valid outcome — crash/blank is not.
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "AANGAN"
- assertVisible: "AATMA"
- tapOn: "MANDIR"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "MANDIR"
- tapOn: "AATMA"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "AATMA"
