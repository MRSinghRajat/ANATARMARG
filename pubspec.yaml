name: ashrae_playground
description: Ashrae Playground - A copy of the original project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Configuration
  flutter_dotenv: ^5.1.0

  # State Management
  flutter_riverpod: ^2.4.0
  
  # Animation
  rive: ^0.11.17  # Updated for better compatibility
  
  # Authentication
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  
  # Networking
  http: ^1.1.0
  
  # Database
  supabase_flutter: ^2.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # Audio
  audioplayers: ^5.2.0
  
  # UI
  cached_network_image: ^3.3.0
  intl: ^0.18.0
  fl_chart: ^0.65.0
  
  # Interactive Features
  scratcher: ^2.5.0
  sensors_plus: ^6.1.0
  confetti: ^0.7.0
  lottie: ^3.1.0

  # Utilities
  uuid: ^4.3.0
  google_fonts: ^6.1.0
  app_links: ^6.3.2
  image_picker: ^1.0.7
  
  # In-App Purchases (RevenueCat)
  purchases_flutter: ^8.10.1
  purchases_ui_flutter: ^8.10.1
  
  # URL Launcher (for subscription management)
  url_launcher: ^6.2.0
  share_plus: ^12.0.1
  clock: ^1.1.2

  # WebView (for 3D Test UI)
  webview_flutter: ^4.10.0

  # Push Notifications (FCM / Apple APNs)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.0.0

  # Local scheduled notifications (daily "tasks ready")
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/rive/
    - assets/fonts/
    - assets/html/
    - assets/models/
    - .env

  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic

    - family: Crimson Pro
      fonts:
        - asset: assets/fonts/CrimsonPro-Regular.ttf
        - asset: assets/fonts/CrimsonPro-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Regular.ttf
        - asset: assets/fonts/LibreBaskerville-Bold.ttf
          weight: 700
        - asset: assets/fonts/LibreBaskerville-Italic.ttf
          style: italic

    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
